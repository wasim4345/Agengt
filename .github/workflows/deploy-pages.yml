name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/m13-iimcip-context-935f
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Project site: https://wasim4345.github.io/Agengt/
          NEXT_PUBLIC_BASE_PATH: /Agengt

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # Fallback publish path: gh-pages branch (works even when the
      # github-pages environment only allows main for Actions deploy).
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only succeeds when this branch is allowed on the github-pages environment
    # (main, or “All branches” / this tip branch added in Settings → Environments).
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (Actions)
        id: deployment
        uses: actions/deploy-pages@v4
