name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/m13-iimcip-context-935f
  workflow_dispatch:

# Publishes static `out/` to the `gh-pages` branch.
# Point Settings → Pages → Source to: Deploy from a branch → gh-pages / (root).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Project site: https://wasim4345.github.io/Agengt/
          NEXT_PUBLIC_BASE_PATH: /Agengt

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false
